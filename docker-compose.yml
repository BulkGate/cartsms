services:
  opencart:
    build:
      dockerfile: Dockerfile
      args:
        OC_VERSION: ${OC_VERSION:-latest}
    image: opencart:${OC_VERSION:-latest}
    depends_on:
      - db
    ports:
      - "8083:80"
#    user: www-data
#    env_file:
#      - ./.env
#    environment:
#      OC_VERSION: 3.1
    volumes:
      - ./admin:/var/www/html/extension/oc_cartsms/admin
      - ./src:/var/www/html/extension/oc_cartsms/src
      - ./tests:/var/www/html/extension/oc_cartsms/tests
      - ./vendor:/var/www/html/extension/oc_cartsms/vendor
      - ./install.json:/var/www/html/extension/oc_cartsms/install.json

  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: opencart
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db:/var/lib/mysql

  adminer:
    image: adminer
    environment:
      ADMINER_DESIGN: "nette"
      ADMINER_DEFAULT_SERVER: "db"
    ports:
      - "8090:8080"

volumes:
  db: